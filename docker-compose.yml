# D:\Alscode\YBA\docker-compose.yml

name: yba
services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  directus:
    image: directus/directus:latest
    restart: unless-stopped
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: https://cms.ysgolbrynalyn.co.uk
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: "${SITE_URL}"
    volumes:
      - ./directus-uploads:/directus/uploads
    depends_on:
      - database
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DIRECTUS_URL: https://cms.ysgolbrynalyn.co.uk
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TERM_DATES_ICS_URL: ${TERM_DATES_ICS_URL}
    depends_on:
      - directus
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - directus
volumes:
  postgres_data:
  caddy_data:
  caddy_config: