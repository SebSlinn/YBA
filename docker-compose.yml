name: yba
services:

  database:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directuspassword

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  directus:
    image: directus/directus:latest

    restart: unless-stopped

    ports:
      - "8055:8055"

    environment:

      KEY: changeme
      SECRET: changeme

      DB_CLIENT: pg

      DB_HOST: database
      DB_PORT: 5432

      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: directuspassword

      ADMIN_EMAIL: admin@school.local
      ADMIN_PASSWORD: ChangeMe123!

    depends_on:
      - database

volumes:
  postgres_data: